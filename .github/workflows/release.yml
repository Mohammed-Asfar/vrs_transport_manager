name: Update Firestore Version

# Trigger: when develop is merged into main
on:
  push:
    branches:
      - main

jobs:
  update-firestore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Read version from app_version.dart ────────────────
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP "currentVersion\s*=\s*'\K[^']+" lib/core/utils/app_version.dart)
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # ── Read release notes ────────────────────────────────
      - name: Read release notes
        id: notes
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          else
            NOTES="Release v${{ steps.version.outputs.VERSION }}"
          fi
          echo "NOTES=$NOTES" >> $GITHUB_OUTPUT

      # ── Update Firestore app_config/version ───────────────
      - name: Update Firestore version
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v$VERSION"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/VRS_Transport_Manager_Setup_$VERSION.exe"
          NOTES="${{ steps.notes.outputs.NOTES }}"

          # Build JWT from service account
          SA_EMAIL=$(echo "$FIREBASE_SA" | python3 -c "import sys,json; print(json.load(sys.stdin)['client_email'])")
          SA_KEY=$(echo "$FIREBASE_SA" | python3 -c "import sys,json; print(json.load(sys.stdin)['private_key'])")

          # Create JWT with python
          JWT=$(python3 -c "
          import json, time, base64, hashlib
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          header = b64url(json.dumps({'alg':'RS256','typ':'JWT'}).encode())
          now = int(time.time())
          claims = b64url(json.dumps({
              'iss': '$SA_EMAIL',
              'scope': 'https://www.googleapis.com/auth/datastore',
              'aud': 'https://oauth2.googleapis.com/token',
              'iat': now, 'exp': now + 3600
          }).encode())

          unsigned = f'{header}.{claims}'.encode()
          key = serialization.load_pem_private_key('''$SA_KEY'''.encode(), password=None)
          sig = key.sign(unsigned, padding.PKCS1v15(), hashes.SHA256())
          print(f'{header}.{claims}.{b64url(sig)}')
          ")

          # Get access token
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$JWT" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # Update Firestore
          curl -s -X PATCH \
            "https://firestore.googleapis.com/v1/projects/vrs-transport-db/databases/(default)/documents/app_config/version" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"latest_version\": {\"stringValue\": \"$VERSION\"},
                \"download_url\": {\"stringValue\": \"$DOWNLOAD_URL\"},
                \"release_notes\": {\"stringValue\": \"$NOTES\"},
                \"force_update\": {\"booleanValue\": true},
                \"updated_at\": {\"stringValue\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}
              }
            }"

          echo "Firestore updated: v$VERSION -> $DOWNLOAD_URL"
