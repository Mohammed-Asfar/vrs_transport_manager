<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0060D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#bg)" />

  <!-- Subtle road/path curve in background -->
  <path d="M 0 380 Q 180 320 256 340 Q 340 362 512 300"
        stroke="url(#road)" stroke-width="48" fill="none" stroke-linecap="round"/>

  <!-- Truck body - simplified, geometric -->
  <g transform="translate(256, 220)" >
    <!-- Cargo container -->
    <rect x="-110" y="-72" width="145" height="95" rx="10" ry="10"
          fill="#FFFFFF" opacity="0.95"/>

    <!-- Cab -->
    <path d="M 35,-72 L 35,-72 L 80,-72 Q 100,-72 108,-52 L 115,-32
            Q 118,-22 118,-12 L 118,23 L 35,23 Z"
          fill="#FFFFFF" opacity="0.95"/>

    <!-- Windshield -->
    <path d="M 50,-58 L 78,-58 Q 92,-58 98,-42 L 104,-26 L 50,-26 Z"
          fill="#0A84FF" opacity="0.6"/>

    <!-- Wheels -->
    <circle cx="-68" cy="35" r="22" fill="#1E1E1E" opacity="0.9"/>
    <circle cx="-68" cy="35" r="12" fill="#3A3A3C"/>
    <circle cx="-68" cy="35" r="5" fill="#636366"/>

    <circle cx="85" cy="35" r="22" fill="#1E1E1E" opacity="0.9"/>
    <circle cx="85" cy="35" r="12" fill="#3A3A3C"/>
    <circle cx="85" cy="35" r="5" fill="#636366"/>

    <!-- Headlight -->
    <rect x="113" y="-8" width="8" height="14" rx="3" fill="#FFD60A" opacity="0.9"/>
  </g>

  <!-- VRS text -->
  <text x="256" y="358"
        font-family="Segoe UI, SF Pro Display, Helvetica Neue, Arial, sans-serif"
        font-size="72" font-weight="800"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="12">
    VRS
  </text>

  <!-- Tagline -->
  <text x="256" y="400"
        font-family="Segoe UI, SF Pro Display, Helvetica Neue, Arial, sans-serif"
        font-size="24" font-weight="400"
        fill="#FFFFFF" opacity="0.7" text-anchor="middle" letter-spacing="4">
    TRANSPORT
  </text>
</svg>
