<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0060D0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="52" ry="52" fill="url(#bg)" />

  <!-- Simplified bold truck — optimized for small sizes -->
  <g transform="translate(128, 118)">
    <!-- Cargo box -->
    <rect x="-72" y="-48" width="96" height="68" rx="6" fill="#FFFFFF"/>

    <!-- Cab -->
    <path d="M 24,-48 L 60,-48 Q 74,-48 80,-34 L 84,-22 Q 86,-16 86,-8 L 86,20 L 24,20 Z"
          fill="#FFFFFF"/>

    <!-- Windshield -->
    <rect x="34" y="-38" width="36" height="26" rx="4" fill="#0A84FF" opacity="0.5"/>

    <!-- Wheels - bold circles -->
    <circle cx="-40" cy="28" r="16" fill="#1A1A2E"/>
    <circle cx="-40" cy="28" r="7" fill="#48484A"/>

    <circle cx="58" cy="28" r="16" fill="#1A1A2E"/>
    <circle cx="58" cy="28" r="7" fill="#48484A"/>
  </g>

  <!-- Bold VRS text -->
  <text x="128" y="212"
        font-family="Arial, Helvetica, sans-serif"
        font-size="40" font-weight="900"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    VRS
  </text>
</svg>
